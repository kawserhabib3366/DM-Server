version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: campaign_db
      MYSQL_USER: dmserver
      MYSQL_PASSWORD: kawser
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - mysql
    environment:
      - DATABASE_URL=mysql+pymysql://dmserver:kawser@mysql/campaign_db

  dashboard:
    build:
      context: ./template/dashboard
      dockerfile: Dockerfile.dashboard
    container_name: flask_dashboard
    ports:
      - "5000:5000"
    restart: always
    depends_on:
      - mysql
    environment:
      - SQLALCHEMY_DATABASE_URI=mysql+pymysql://dmserver:kawser@mysql/campaign_db

volumes:
  mysql_data:
