services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    restart: always

  dashboard:
    build:
      context: ./template/dashboard
      dockerfile: Dockerfile.dashboard
    container_name: flask_dashboard
    ports:
      - "5000:5000"
    restart: always
